services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DISCORD_ADMIN_CHANNEL_ID: ${DISCORD_ADMIN_CHANNEL_ID:-}
      DISCORD_ADMIN_USER_IDS: ${DISCORD_ADMIN_USER_IDS:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_APPROVAL_WEBHOOK_URL: ${DISCORD_APPROVAL_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_DAN_ROLE_IDS: ${DISCORD_DAN_ROLE_IDS:-}
      DISCORD_GATEWAY_ENABLED: ${DISCORD_GATEWAY_ENABLED:-1}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_REGISTER_COMMANDS: ${DISCORD_REGISTER_COMMANDS:-1}
      DISCORD_UPLOAD_DB: ${DISCORD_UPLOAD_DB:-}
      DISCORD_UPLOAD_MAX_BYTES: ${DISCORD_UPLOAD_MAX_BYTES:-25165824}
      DISCORD_WELCOME_CHANNEL_ID: ${DISCORD_WELCOME_CHANNEL_ID:-}
      DISCORD_WELCOME_CHANNEL_NAME: ${DISCORD_WELCOME_CHANNEL_NAME:-일반}
      DISCORD_WELCOME_ENABLED: ${DISCORD_WELCOME_ENABLED:-1}
      DISCORD_WELCOME_MESSAGE: ${DISCORD_WELCOME_MESSAGE:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      QWILIGHT_API_BASE: ${QWILIGHT_API_BASE:-https://taehui.net/qwilight/www}
      QWILIGHT_HTTP_TIMEOUT_SECONDS: ${QWILIGHT_HTTP_TIMEOUT_SECONDS:-15}
      QWILIGHT_NOTE_CACHE_TTL_SECONDS: ${QWILIGHT_NOTE_CACHE_TTL_SECONDS:-43200}
      QWILIGHT_RANKING_CACHE_TTL_SECONDS: ${QWILIGHT_RANKING_CACHE_TTL_SECONDS:-300}
      QWILIGHT_RANKING_LIMIT: ${QWILIGHT_RANKING_LIMIT:-10}
      QWILIGHT_SEARCH_MAX_PAGES: ${QWILIGHT_SEARCH_MAX_PAGES:-5}
      TABLE_ADMIN_AUDIT_LOG: ${TABLE_ADMIN_AUDIT_LOG:-}
      TABLE_ADMIN_AUTH_DB: ${TABLE_ADMIN_AUTH_DB:-}
      TABLE_ADMIN_TOKEN: ${TABLE_ADMIN_TOKEN:-}
      TABLE_STATE_DIR: /app/for-calc-web/state
    volumes:
      - table-state:/app/for-calc-web/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  table-state:
